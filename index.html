
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laila WebAR | الواقع المعزز</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
    }
    header {
      padding: 22px 12px;
    }
    h1 { color: #8ed8ff; }
    p { color: #d6e3f0; }
    .hint { font-size: 14px; }
    a-scene { width: 100%; height: 75vh; }
  </style>
</head>

<body>
  <header>
    <h1>الواقع المعزز التفاعلي</h1>
    <p>وجّهي كاميرا جوالك نحو صفحة الكتاب</p>
    <p class="hint">انتظري حتى يتعرف النظام على الصورة</p>
  </header>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-sphere
        position="0 0.4 0"
        radius="0.18"
        color="#36BDF5"
        animation="property: position; to: 0 0.7 0; dir: alternate; loop: true; dur: 1200">
      </a-sphere>

      <a-ring
        position="0 0 0"
        rotation="0 0 0"
        radius-inner="0.25"
        radius-outer="0.3"
        color="#FFD166">
      </a-ring>

      <a-text
        value="تم التعرف على الصفحة!"
        position="0 -0.4 0"
        align="center"
        color="#FFFFFF"
        width="2.5">
      </a-text>

    </a-entity>
  </a-scene>
</body>
</html>
