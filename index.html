
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الواقع المعزز التفاعلي - ليلى المحمدي</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #101820;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    h1 {
      color: #e5b94c;
      font-size: 27px;
    }

    p {
      line-height: 1.8;
    }

    button {
      background: #e5b94c;
      color: #101820;
      border: none;
      padding: 16px 35px;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
      margin-top: 20px;
    }

    #error {
      color: #ff9999;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="start">
  <h1>الواقع المعزز التفاعلي</h1>

  <p>مرحباً بك في تجربة تعليمية تفاعلية.</p>

  <p>وجّهي كاميرا الجوال نحو صفحة الكتاب لمشاهدة المحتوى المتحرك.</p>

  <button id="startButton">ابدأ التجربة</button>

  <p id="error"></p>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="myVideo"
      src="./video_iphone.mov"
      preload="auto"
      muted
      playsinline
      webkit-playsinline
      loop
      crossorigin="anonymous">
    </video>
  </a-assets>

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-video
  src="#video"
  width="0.8"
  height="0.45"
  position="0 0 0.05"
  rotation="0 0 0">
</a-video>
    </a-video>

  </a-entity>

</a-scene>

<script>
const scene = document.querySelector("a-scene");
const video = document.querySelector("#myVideo");
const button = document.querySelector("#startButton");
const error = document.querySelector("#error");

let started = false;

button.addEventListener("click", async () => {

  try {
    error.textContent = "جاري تشغيل التجربة...";

    video.muted = true;

    await video.play();
    video.pause();

    await scene.systems["mindar-image-system"].start();

    started = true;

    document.querySelector("#start").style.display = "none";

  } catch (e) {

    console.error(e);

    error.textContent =
      "تعذر تشغيل الفيديو أو الكاميرا. تأكدي من صيغة الفيديو وملفات المشروع.";

  }

});

scene.addEventListener("targetFound", () => {
  if (started) {
    video.play().catch(err => console.error(err));
  }
});

scene.addEventListener("targetLost", () => {
  video.pause();
});
</script>

</body>
</html>
