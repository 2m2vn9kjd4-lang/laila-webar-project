
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الواقع المعزز - ليلى المحمدي</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #101820;
      color: white;
      text-align: center;
    }

    #start {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #101820;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    button {
      background: #e5b94c;
      border: 0;
      padding: 16px 35px;
      border-radius: 12px;
      font-size: 19px;
      font-weight: bold;
    }

    h2 { color: #e5b94c; }
  </style>
</head>

<body>

<div id="start">
  <h2>الواقع المعزز التفاعلي</h2>
  <p>ليلى المحمدي</p>
  <p>وجّهي الكاميرا نحو صفحة الكتاب لعرض التجربة التعليمية.</p>
  <button onclick="startAR()">ابدأ التجربة</button>
  <p id="error"></p>
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: false;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true;"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <video
      id="myVideo"
      src="./video.mp4"
      preload="auto"
      playsinline
      webkit-playsinline
      muted
      loop>
    </video>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-video
      src="#myVideo"
      position="0 0 0.1"
      width="1"
      height="0.56">
    </a-video>
  </a-entity>

</a-scene>

<script>
async function startAR() {
  const error = document.getElementById("error");
  const video = document.getElementById("myVideo");
  const scene = document.querySelector("a-scene");

  try {
    video.muted = true;
    await video.play();
    video.pause();

    await scene.systems["mindar-image-system"].start();

    document.getElementById("start").style.display = "none";
    video.play().catch(() => {});
  } catch (e) {
    error.textContent = "تعذر تشغيل التجربة. تأكدي من ملفات المشروع وإذن الكاميرا.";
    console.error(e);
  }
}
</script>

</body>
</html>
