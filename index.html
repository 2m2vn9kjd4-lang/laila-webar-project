
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>الواقع المعزز - ليلى المحمدي</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #start {
      position: absolute;
      z-index: 10;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 25px;
      font-size: 20px;
      background: #1677c8;
      color: white;
      border: 0;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <button id="start">ابدئي تجربة الواقع المعزز</button>

  <video
    id="boyVideo"
    src="./881057371_1793800741306486.mp4"
    loop
    muted
    playsinline
    webkit-playsinline
    crossorigin="anonymous"
    style="display:none">
  </video>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="boyAsset"
        src="./881057371_1793800741306486.mp4"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video
        src="#boyAsset"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double">
      </a-video>
    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const video = document.querySelector("#boyAsset");
    const startButton = document.querySelector("#start");

    startButton.addEventListener("click", async () => {
      try {
        await video.play();
        await scene.systems["mindar-image"].start();
        startButton.style.display = "none";
      } catch (error) {
        alert("تعذر تشغيل التجربة. تأكدي من السماح باستخدام الكاميرا.");
        console.error(error);
      }
    });
  </script>
</body>
</html>
