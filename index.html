
<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الواقع المعزز - ليلى المحمدي</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #start {
      position: fixed;
      z-index: 100;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 24px;
      background: #1677c8;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
    }

    #message {
      position: fixed;
      z-index: 101;
      bottom: 20px;
      left: 10px;
      right: 10px;
      color: white;
      text-align: center;
      background: rgba(0,0,0,.65);
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <button id="start">ابدئي تجربة الواقع المعزز</button>
  <div id="message">وجّهي الكاميرا نحو صفحة الكتاب</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="boyVideo"
        src="./881057371_1793800741306486.MP4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline>
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0">

      <a-video
        src="#boyVideo"
        position="0 0 0.05"
        width="1"
        height="1.5"
        material="shader: flat; transparent: true; side: double">
      </a-video>

    </a-entity>

  </a-scene>

  <script>
    const scene = document.querySelector("a-scene");
    const video = document.querySelector("#boyVideo");
    const button = document.querySelector("#start");
    const message = document.querySelector("#message");
    const target = document.querySelector("[mindar-image-target]");

    button.addEventListener("click", async () => {
      try {
        message.textContent = "جاري تشغيل الكاميرا...";

        await scene.systems["mindar-image"].start();

        message.textContent = "ابحثي عن صفحة الكتاب...";
        await video.play();

        button.style.display = "none";

      } catch (error) {
        message.textContent = "خطأ: " + error.message;
        console.error(error);
      }
    });

    target.addEventListener("targetFound", () => {
      video.play().catch(error => console.error(error));
      message.textContent = "تم التعرف على الصفحة!";
    });

    target.addEventListener("targetLost", () => {
      video.pause();
      message.textContent = "وجّهي الكاميرا نحو صفحة الكتاب";
    });
  </script>

</body>
</html>
